title: MonsterTix
subtitle: Build a long-running agent on Google Cloud, one task from start to finish
tagline: >
  Get two tickets to the Amsterdam show for you and Sam. The agent waits in a
  14,000-person queue, survives being killed, buys inside the limit you confirm,
  and finishes from a cloud timer while you sleep.
