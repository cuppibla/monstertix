<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ADK writes the session into sessions.db and saved files into artifacts/</title>
  <desc id="d">The adk web process sends every message, tool call and state change to sessions.db through the session service, and files the agent saves to the artifacts folder through the artifact service. Both stay on disk when the process stops.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="419" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- the process -->
  <rect x="28" y="80" width="240" height="236" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="48" y="110" font-size="15" font-weight="700" fill="#0f172a">adk web</text>
  <text x="48" y="130" font-size="12" fill="#64748b">a process on port 8000</text>
  <rect x="48" y="146" width="200" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="62" y="168" font-size="12.5" fill="#0f172a">agent: concert</text>
  <rect x="48" y="190" width="200" height="28" rx="14" fill="#dbeafe"/>
  <text x="60" y="208" font-size="11" fill="#1e3a8a">"Sam can't do weeknights"</text>
  <rect x="48" y="226" width="200" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="60" y="244" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#334155">⚡ note_companion</text>
  <rect x="48" y="262" width="200" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="60" y="280" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#334155">⚡ get_seatmap</text>

  <!-- session service arrow -->
  <text x="292" y="92" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0e7490">--session_service_uri</text>
  <text x="292" y="110" font-size="11" fill="#64748b">every message, tool call and</text>
  <text x="292" y="124" font-size="11" fill="#64748b">state change: one row each</text>
  <path d="M268 160 C 360 160, 420 120, 520 120" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- artifact service arrow -->
  <path d="M268 272 C 360 272, 420 300, 520 300" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="292" y="318" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#b45309">--artifact_service_uri</text>
  <text x="292" y="336" font-size="11" fill="#64748b">files the agent saves</text>

  <!-- sessions.db -->
  <g transform="translate(526 34)">
    <path d="M0 16 a180 16 0 0 0 360 0 v150 a180 16 0 0 1 -360 0 z" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
    <ellipse cx="180" cy="16" rx="180" ry="16" fill="#cffafe" stroke="#0e7490" stroke-width="1.5"/>
    <text x="22" y="54" font-size="14" font-weight="700" fill="#0f172a">sessions.db</text>
    <text x="114" y="54" font-size="11.5" fill="#64748b">SQLite, in your workshop folder</text>
    <text x="22" y="82" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#155e75">sessions</text>
    <text x="118" y="82" font-size="11" fill="#475569">one row per conversation</text>
    <text x="22" y="104" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#155e75">events</text>
    <text x="118" y="104" font-size="11" fill="#475569">one row per turn, as event_data JSON</text>
    <text x="22" y="126" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#155e75">user_states</text>
    <text x="118" y="126" font-size="11" fill="#475569">user: keys, across sessions</text>
    <text x="22" y="148" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#155e75">app_states</text>
    <text x="118" y="148" font-size="11" fill="#475569">app: keys</text>
  </g>

  <!-- artifacts/ -->
  <g transform="translate(526 244)">
    <path d="M0 10 a8 8 0 0 1 8 -8 h96 l14 14 h234 a8 8 0 0 1 8 8 v96 a8 8 0 0 1 -8 8 h-344 a8 8 0 0 1 -8 -8 z" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="20" y="46" font-size="14" font-weight="700" fill="#0f172a">artifacts/</text>
    <text x="104" y="46" font-size="11.5" fill="#64748b">a folder on disk</text>
    <rect x="20" y="60" width="320" height="28" rx="6" fill="#ffffff" stroke="#fcd34d"/>
    <text x="32" y="79" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#92400e">seatmap_ms-ams-01.json</text>
    <text x="20" y="110" font-size="11" fill="#475569">filed by app, user and session</text>
  </g>

  <line x1="28" y1="382" x2="892" y2="382" stroke="#e2e8f0"/>
  <text x="28" y="404" font-size="12" fill="#334155">Stop the process and both stay on disk. Start <tspan font-family="ui-monospace, Menlo, monospace">adk web</tspan> again with the same two flags and ADK reads them back.</text>
</svg>
