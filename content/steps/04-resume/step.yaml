title: Pause, Restart, Resume
minutes: 18
color: amber
stage: 4
summary: The queue is forty minutes long and nobody should keep a process alive for it. In this chapter the
  wait becomes a pause written to the session store, the agent gets killed in the middle of it, and the same
  task picks up where it stopped, with the same ticket, until it is at the front of the queue and ready to
  buy. Nothing is bought yet.
parts:
- id: a
  label: Stop
  headline: The run stops itself, and writes down where
  body: a-pause.md
  exercises:
    run:
      title: Start the task and watch it stop on purpose
      intro: 'Load chapter 4. The dropdown still says `concert`, but what answers is now a graph: `open_the_night
        → pick_show → queue_up → check_front → ready_to_buy`. You will not pause anything by hand. One message
        starts the graph, and the graph stops itself.'
      apps:
      - agent
      - venue
      tasks:
      - kind: prepare
        id: prepare
        step: 4
      - kind: files
        id: files
        open: agent/concert/nightly.py
        stage: 4
        compare: 3
        only:
        - agent/concert/
        highlight: ^@node\(rerun_on_resume=|^pick_show = node\(picker|^\s+return RequestInput\(|^QUEUE_WAIT
          = |^nightly = Workflow\(|edges=\[\(START|^root_agent = nightly|resumability_config=ResumabilityConfig
        highlightLabel: '`nightly` is the graph and `root_agent` now points at it. One node is an agent (`pick_show`);
          the rest are functions. `check_front` returns `RequestInput` when you are not at the front, which
          parks the run; `ResumabilityConfig` is what lets it be picked up.'
      - kind: turn
        id: turn
        items:
        - text: Press **New Session** in the ADK web UI.
          look: agent
        - text: One message starts the graph. Watch the left panel colour the nodes in as they run, and watch
            the agent log (**log**, at the top of the drawer).
          say: Get me and Sam two tickets to the Amsterdam show.
          in: agent
        - text: In **State**, find `queue_ticket`, `queue_event_id` and `plan`. Then return to **Events** and
            find `adk_request_input`. The workflow created this pause automatically because the ticket is not
            yet at the front. Its response box is for a resume signal; you do not need to type an answer here.
          look: agent
        - text: 'Look at the venue panel: the ticket keeps moving toward the front. The agent’s current run
            has ended and the task is paused. The ADK service can still be running; the venue maintains your
            place independently.'
          look: venue
        - text: 'Once you see `adk_request_input`, this section is finished: the task is paused automatically.
            Go to **4b · Kill** below. That page has the kill, restart, skip-the-wait and resume buttons in
            order. You do not need to resume on this page.'
          next:
            to: /step/resume/b
            label: Continue to 4b · Kill, restart, resume
  expect:
  - The graph lights up `START`, `open_the_night`, `pick_show`, `queue_up` and `check_front`. `ready_to_buy`
    stays grey.
  - 'The agent log: `[open]        Nobody is awake. Choosing the show.`, `[queue_up]    ms-ams-01 section A
    — ticket q_… at #14,203`, then `[check_front] #14,… — not yet. Pausing.`'
  - '**State**: `queue_ticket: q_…`, `queue_event_id: ms-ams-01`, `plan: {event_id: ms-ams-01, section: A,
    seats: 2, …}`, `request: Get me and Sam two tickets…`'
  - 'The last event is a function call `adk_request_input` with the message *Still in the queue at #14,… .
    Wake me again and I will check.* Then nothing: the run has ended.'
  - 'Venue banner: **Your ticket is in line, #14,…**. The venue maintains the queue even if the agent process
    stops.'
  - 'The task card on this page: *paused in the queue · nothing is running* · paused on **the queue** · `queue:wait`
    · ticket `q_… · ms-ams-01`.'
  checks:
  - id: nodes
    label: '`pick_show`, `queue_up` and `check_front` ran in this session'
    probe: python3 -m workbench.probe nodes pick_show queue_up check_front --current
    hint: 'In a new session, send "Get me and Sam two tickets to the Amsterdam show." If the graph stops after
      `pick_show` with no ticket, read the agent log: the venue may be down. Restart the venue from its switch
      and load chapter 4 again.'
  - id: ticket
    label: '`queue_up` wrote `queue_ticket` into session state'
    probe: python3 -m workbench.probe state queue_ticket --current
    hint: The ticket is written when `queue_up` runs. If `pick_show` returned no plan, the log says `[queue_up]    no
      show chosen`; start a new session and send the message again.
  - id: paused
    label: The task is paused on the queue, holding a ticket
    probe: python3 -m workbench.probe task --kind queue --ticket
    hint: '`check_front` returns `RequestInput(interrupt_id="queue:wait")` when you are not at the front. If
      the task card says *ready to buy* already, somebody pressed SKIP THE WAIT before the run: press RESET
      THE VENUE and start a new session.'
  - id: oneticket
    label: The venue handed out exactly one queue ticket
    probe: python3 -m workbench.probe tickets --count 1
    hint: Two tickets means two runs joined the queue, usually from a second message in the chat box. Load
      chapter 4 again (it resets the venue) and send the message once, in a new session.
- id: b
  label: Kill
  headline: Nothing dies with the process
  body: b-restart.md
  exercises:
    run:
      title: Kill the process, then continue the same task
      needs: The task you started in 4a, parked in the queue. If the task card says *no task yet*, go back
        to 4a and send the message.
      intro: Test whether the saved task survives a crash. Use the buttons below in order. Keep the same session
        and queue ticket throughout; do not load the chapter again or send a new chat message.
      apps:
      - agent
      - venue
      tasks:
      - kind: turn
        id: turn
        items:
        - text: Click **kill -9** below to simulate an ADK process crash. Expect its status to change to **killed**;
            ADK cannot accept messages until restarted. The task was already saved at the pause.
          service: agent
          action: kill
        - text: 'Check the **Venue panel** on the left. The same `q_…` ticket is still there and its position
            keeps dropping. This is expected: the venue is a separate service and keeps your place while ADK
            is stopped.'
          look: venue
        - text: Click **Start Agent · adk web** below. Wait for **running**. The service is available again,
            but the task is still paused; starting the service does not resume it. The venue panel should keep
            showing the same ticket.
          service: agent
          action: start
        - text: Click **SKIP THE WAIT** below. Expect the venue to show **AT THE FRONT**, with the same `q_…`
            ticket. This advances the venue queue; the task still needs the resume signal in the next step.
          press: SKIP THE WAIT
          venue: advance-queue
        - text: 'Click **Resume current task** below. Expect **Complete: the task reached the front** and **Tickets
            bought = 0**. Compare the ticket shown below with the one from before the crash. The button then
            disables because this chapter’s task has finished.'
          resume: task
  expect:
  - 'After kill -9: the venue panel keeps counting down the same `q_…` ticket. The ADK web UI drawer says *killed*
    until you start it again.'
  - 'After SKIP THE WAIT and Resume: `[check_front] at the front`, then `[ready]       at the front for ms-ams-01.
    Ready to buy.` The graph is fully green.'
  - 'Venue: the same ticket, **AT THE FRONT**, and zero orders. Beside Resume: **Complete: the task reached
    the front of the queue. Nothing has been bought.**'
  checks:
  - id: killed
    label: The agent was killed with -9, then started again
    probe: python3 -m workbench.probe killed agent --restarted
    hint: Use **kill -9** at the top of the ADK web UI drawer, then its switch to start it again. Stopping
      it with the switch is a clean shutdown and does not count.
  - id: resumed
    label: It was woken again and kept the same place in line
    probe: python3 -m workbench.probe resumed
    hint: 'Press **Resume current task**, not the chat box. If the report says *it joined the queue again*,
      a message went through the chat box and started a new run: load chapter 4 again and repeat 4A and 4B
      in one session.'
  - id: ready
    label: The task reached `ready_to_buy`
    probe: python3 -m workbench.probe task --ready
    hint: 'Press SKIP THE WAIT on the venue panel, then Resume current task once. If the card still says *paused
      in the queue*, the venue clock may be slow: check the panel says AT THE FRONT before resuming.'
  - id: oneticket
    label: Still exactly one queue ticket at the venue
    probe: python3 -m workbench.probe tickets --count 1
    hint: 'A second ticket means the graph ran `queue_up` twice: a new invocation from the chat box, or a second
      session. Load chapter 4 again and do 4A and 4B once each.'
  - id: node
    label: '`ready_to_buy` ran in this session'
    probe: python3 -m workbench.probe nodes ready_to_buy --current
    hint: '`ready_to_buy` only runs after `check_front` finds the ticket at the front. SKIP THE WAIT, then
      Resume current task.'
- id: c
  label: Resume
  headline: What runs again, and what must not
  body: c-resumed.md
  exercises:
    read:
      title: Find the resume in the events
      needs: The session from 4b, after its one Resume.
      intro: The task has finished. This section only inspects its saved Events; no more messages or human-input
        answers are needed.
      apps:
      - agent
      tasks:
      - kind: files
        id: files
        open: agent/concert/nightly.py
        stage: 4
        compare: 3
        only:
        - agent/concert/
        highlight: ^@node\(rerun_on_resume=True\)|^@node\(rerun_on_resume=False\)|^pick_show = node\(picker,
          rerun_on_resume=False\)|interrupt_id=QUEUE_WAIT|status = venue\.get\(f"/queue/\{ticket\}"\)|resumability_config=ResumabilityConfig\(is_resumable=True\)
        highlightLabel: Completed nodes reuse their recorded outputs. For the node stopped on an answered interrupt,
          rerun_on_resume=True runs its function again; False uses the answer as its output. check_front must
          run again to read the live queue.
      - kind: turn
        id: turn
        items:
        - text: Click **Open this task in ADK** below. It opens the current task’s session and reloads its
            Events, including the Resume result. If ADK was already open, it may have been showing the older
            paused view.
          look: agent
          inspectTask: true
        - text: 'In **Events**, scroll past the old `adk_request_input` call. That input box belongs to the
            earlier pause; **do not fill it in**. Find its later tool response containing `checked: true`,
            then the final **Ready to buy** result. The Resume button submitted that response for you.'
        - text: 'In **State**, confirm the same `queue_ticket` and `ready_to_buy: true`. This is the result:
            the task continued after the crash, using the saved ticket. The explanation below shows why completed
            nodes reuse their outputs while `check_front` runs again.'
  expect:
  - 'Run 1 ends on `adk_request_input` (`queue:wait`). Run 2 begins with its response, `{"checked": true}`,
    which the Resume button sent.'
  - In run 2 the only node with a fresh execution before `ready_to_buy` is `check_front`; its event carries
    the new position. The log has one `[check_front]` line per resume and one `[queue_up]` line in total.
  - 'Session state after it all: one `queue_ticket`, the same `plan`, and `ready_to_buy: true`.'
  checks:
  - id: answered
    label: The queue wait was answered, not re-asked from the chat
    probe: python3 -m workbench.probe pending --current --answered
    hint: Every `adk_request_input` in this session should have a matching response. If one is still waiting,
      press Resume current task; if the card says nothing is paused, 4B is done.
  - id: once
    label: Woken again, and still one ticket
    probe: python3 -m workbench.probe resumed
    hint: This is 4B's result read again. A second `queue_ticket` in state means a new run joined the queue;
      the Checkpoint on this page explains the ways that can happen.
