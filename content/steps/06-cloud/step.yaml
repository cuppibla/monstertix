title: Run It While You Sleep
kicker: Chapter 6
minutes: 15
color: blue
stage: 6
summary: 'The same graph, the same guard, the same key — on Cloud Run, with Cloud SQL under it and Cloud Scheduler
  as the clock. Create the task there, let the scheduler finish it, then take it all down.

  '
parts:
- id: a
  label: Move
  headline: Move the runtime and storage
  body: a-move.md
  expect:
  - A missing prerequisite produces a red error with the setup command to run. This is a real setup issue,
    not an intentional experiment failure.
  - After deployment, the health check prints JSON with the concert app, a Cloud SQL session path, cloud memory,
    and the cloud Venue URL. It then confirms the session-store read. Only now continue to 6b.
  exercises:
    run:
      title: Deploy the chapter 6 layout
      intro: Load chapter 6 once. This prepares local code; it does not deploy anything. The commands below
        create billed cloud resources in the project shown at the top. Complete each command successfully before
        the next. If you only want the local lab, stop after chapter 5.
      apps:
      - venue
      tasks:
      - kind: prepare
        id: prepare
        step: 6
      - kind: files
        id: files
        open: agent/main.py
        stage: 6
        compare: 5
        only:
        - agent/main.py
        - agent/Dockerfile
        - agent/requirements.txt
        - agent/monstertix/
        - agent/concert/
        highlight: ^SESSION_URI = os\.environ\.get|^ARTIFACT_URI = os\.environ\.get|web=False|trigger_sources=\["pubsub"\]|@app\.post\("/trigger/wake"\)|allow=\("queue",\)|CMD
          exec uvicorn main:app|^asyncpg|^google-cloud-storage
        highlightLabel: '`main.py` is new; `concert/` is byte-for-byte chapter 5. The two service URIs come
          from the environment, `/trigger/wake` is the scheduler''s door, and it resumes only `queue` waits.
          The Dockerfile and requirements are ordinary.'
      - kind: turn
        id: cloud-setup
        items:
        - text: Check the prerequisites first. This is read-only. If the cloud Venue or durable storage is
            missing, use the two setup commands below; an error here means you are not ready to deploy the
            Agent.
          run: python3 scripts/cloud-check.py check
        - text: 'Only if the check says the Venue is missing or local: deploy the ticket seller. This saves
            its HTTPS URL to .env. The local Venue panel may still show your local lab; the cloud has a separate
            panel.'
          run: ./deploy-venue.sh
        - text: 'Only if durable storage is missing: prepare Cloud SQL, its database and user, plus the memory/artifact
            bucket and runtime permissions. A new instance can take 10–15 minutes. Wait for “durable state
            ready”; if it says the instance is still building, rerun this command when it is RUNNABLE.'
          run: ./setup-cloud-state.sh
        - text: Deploy the Agent, then its Pub/Sub connection and Scheduler job. This checks prerequisites
            again and stops on a failed step. Wait for the final deployed message before continuing.
          run: ./deploy-agent.sh
        - text: Verify the deployed Agent, a read from its session database, and the cloud Venue. Blank output
            or an error is a failure, not completion. This does not yet prove a purchase or scheduled delivery;
            you test those in 6b.
          run: python3 scripts/cloud-check.py health
        - text: The task card below is LOCAL. It is not the deployed task. Your local chapter 5 task is not
            migrated. Open the cloud pages in 6b to create a new task there.
  checks:
  - id: loaded
    label: Chapter 6 code is loaded
    probe: python3 -m workbench.probe file agent/main.py trigger/wake
    hint: Load chapter 6 above.
  - id: prerequisites
    label: Cloud configuration and cloud Venue health pass
    probe: python3 scripts/cloud-check.py check
    hint: Complete the Venue and storage setup commands above.
  - id: service
    label: Deployed Agent and session-store read pass
    probe: python3 scripts/cloud-check.py health
    hint: Finish deployment first. Read the error above; do not interpret a blank response as success.
- id: b
  label: Wake
  headline: Resume it from the cloud
  body: b-wake.md
  expect:
  - 'On the cloud page: the same question, *Before I book anything: how many tickets, and the most to pay for
    each?* — banner **waiting for you**. After the read-back and *Yes, that''s right.*: banner **waiting in
    the queue**, and the venue panel shows one ticket at #14,203.'
  - 'After SKIP THE WAIT and `gcloud scheduler jobs run …`: the Cloud Run log reads `[server] answering queue
    interrupt queue:wait`, `[server] woken · session …`, `[server]   called purchase`, `[server]   said   Good
    morning! …`.'
  - 'The page banner turns to **done · order ord_…** and the breakfast message appears without anyone typing.
    The venue panel: **One order, exactly as intended** — two seats, within $250.'
  exercises:
    run:
      title: Create the task in the cloud, then be 3am
      intro: Use the two CLOUD pages in new tabs. The workbench’s embedded Venue and ADK UI may still be local,
        so do not use their controls for this cloud task.
      apps: []
      tasks:
      - kind: turn
        id: cloud-wake
        items:
        - text: 'Print the cloud URLs. Open both: AGENT_SERVICE_URL is MonsterTix; VENUE_URL/panel is the cloud
            ticket seller.'
          run: python3 scripts/cloud-check.py urls
        - text: On the CLOUD Venue page, open Advanced venue controls and press RESET THE VENUE before this
            experiment. This clears that cloud venue’s queue and orders.
        - text: 'On the CLOUD MonsterTix page, start a New Session. In its chat, send: “Get me and Sam two
            tickets to the Amsterdam show.”'
        - text: 'When its banner says waiting for you, answer in that same cloud chat: “Two tickets, up to
            $250 each.” Then answer the read-back: “Yes, that’s right.” Wait for waiting in the queue.'
        - text: 'On the CLOUD Venue page, press SKIP THE WAIT. Confirm that this task’s ticket is at the front.
            Do not type another chat message: the Scheduler will resume it.'
        - text: 'Fire the Scheduler job now instead of waiting for 03:00 UTC. Then watch the cloud page, and
            do not touch it.

            '
          run: bash -c 'WHO=$(gcloud config get-value account 2>/dev/null | cut -d@ -f1 | tr "[:upper:]" "[:lower:]"
            | tr -c "a-z0-9-" "-" | sed "s/-*$//" | cut -c1-24); gcloud scheduler jobs run "${PRESALE_TOPIC:-presale-${WHO:-student}}"
            --location=$REGION --project=$PROJECT'
        - text: Read what the container did.
          run: bash -c 'WHO=$(gcloud config get-value account 2>/dev/null | cut -d@ -f1 | tr "[:upper:]" "[:lower:]"
            | tr -c "a-z0-9-" "-" | sed "s/-*$//" | cut -c1-24); gcloud run services logs read "${AGENT_SERVICE:-concert-${WHO:-student}}"
            --region=$REGION --project=$PROJECT --limit=40'
        - text: On the CLOUD MonsterTix page, expect done and an order ID. On the CLOUD Venue page, expect
            one order for two seats. The local panels and task card do not track this cloud run.
  checks:
  - id: service
    label: Cloud Agent can read its session database
    probe: python3 scripts/cloud-check.py health
    hint: Finish 6a first. To verify the purchase and Scheduler delivery, inspect the cloud pages and logs
      above.
- id: c
  label: Cleanup
  headline: Explain it, then clean up
  body: c-cleanup.md
  expect:
  - '`./destroy-agent.sh` prints `→ removed  schedule …`, `→ removed  subscription …`, `→ removed  topic …`,
    `→ removed  service …`, then `✓ Chapter 6 infrastructure removed.` and lists Cloud SQL and the bucket under
    *still there, because they hold your data and they keep billing*.'
  - '`./destroy-venue.sh` prints `→ removed  venue service venue-…` and `→ .env     VENUE_URL cleared`. After
    it, the CLOUD Venue tab stops answering. A local Venue panel remains separate.'
  - '`./destroy-agent.sh --all` also prints `→ removed  Cloud SQL workshop-sessions` and `→ removed  bucket
    gs://…`, and drops the cloud URIs from `.env`. Anything already gone is reported as `→ absent`.'
  exercises:
    destroy:
      title: Take it down, in order
      intro: 'These delete real cloud resources and cannot be undone. The order matters: the schedule goes
        first, so nothing fires at a half-deleted stack. Skip whatever you want to keep.

        '
      apps: []
      tasks:
      - kind: turn
        id: cloud-cleanup
        items:
        - text: Scheduler job → push subscription → topic → the agent's Cloud Run service. Cloud SQL and the
            bucket are left alone.
          run: ./destroy-agent.sh
        - text: Delete the cloud Venue. Its cloud tab stops answering. The local Venue panel is separate.
          run: ./destroy-venue.sh
        - text: '**Your choice.** Cloud SQL and the bucket hold your sessions, memory and artifacts, and both
            keep billing. When you are certain you are finished:

            '
          run: ./destroy-agent.sh --all
  checks: []
