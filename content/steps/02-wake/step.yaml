title: Wake the Agent
kicker: Chapter 2
minutes: 15
color: red
stage: 2
summary: 'The agent plans the Amsterdam trip well, and does nothing at all when nobody types. No wording fixes
  that. A caller does: first a server that listens, then a clock that calls it.

  '
parts:
- id: a
  label: Prompt
  headline: A prompt cannot start a run
  body: a-prompt.md
  exercises:
    run:
      title: Ask once, then watch what stops
      intro: 'Load chapter 2, send one request in ADK Web, then follow its tool calls. Leave the page open
        after the reply: an instruction does not start another invocation.'
      apps:
      - agent
      - venue
      tasks:
      - kind: prepare
        id: prepare
        step: 2
        explain: Load the same agent as Chapter 1. Leave instruction=INSTRUCTION unchanged. The code viewer
          is read-only; rewriting the instruction is a separate optional experiment below.
      - kind: turn
        id: turn
        items:
        - text: 'In the **ADK web UI**, start a new session and type:'
          say: Which Amsterdam shows still have seats for me and Sam? Keep checking and tell me if anything
            changes.
          in: agent
        - text: 'Read the run in the middle of the screen. Click the `⚡ recall` row, then `⚡ search_events`:
            the left panel shows the arguments the model chose. The `✓` under each is the JSON that came back.
            Then the sentence the model wrote from it.

            '
        - text: 'Look at the venue panel''s **What the agent is doing** feed. Every tool call you just saw
            in the trace is narrated there. Then it goes still.

            '
          look: venue
      - kind: files
        id: files
        open: agent/concert/agent.py
        stage: 2
        compare: 1
        only:
        - agent/concert/
        highlight: ^INSTRUCTION = \x22\x22\x22|^PROACTIVE_INSTRUCTION = \x22\x22\x22|^    instruction=INSTRUCTION,|^    tools=\[
        highlightLabel: 'Read-only: leave instruction=INSTRUCTION unchanged. The main path sends a message
          in ADK Web. The optional prompt experiment has its own editable text box.'
    lab:
      title: Tell it to keep checking, exactly as you would tell a person
      intro: 'Optional: choose a preset or edit the text box below, then press Swap it in and restart the agent.
        The button applies PROACTIVE_INSTRUCTION for you. Send the plan in a new ADK session, then observe
        whether another run starts without a new message.'
      apps:
      - agent
      - venue
      tasks:
      - kind: prompts
        id: lab
        file: agent/concert/agent.py
        original: solutions/step2_wake/concert/agent.py
        say: Keep an eye on the Amsterdam Saturday show for me and Sam, and tell me the moment anything changes.
        prompts:
        - label: Monitor and tell me
          text: 'You are a proactive ticket assistant.


            Monitor the presale for The Midnight Signal. The moment it opens, check whether

            the Amsterdam Saturday show still has seats and tell me — do not wait to be

            asked, and do not wait for me to say anything. Act on your own.


            Keep checking until you have an answer.

            '
        - label: Check every five minutes
          text: 'You are a ticket assistant.


            Every five minutes, check whether the Amsterdam Saturday show of The Midnight

            Signal still has two seats together outside the upper bowl. Tell me as soon as

            anything changes. Do not stop checking.

            '
        - label: Wake yourself up
          text: 'You are a ticket assistant that never sleeps.


            After every reply, wake yourself up again and check the Amsterdam Saturday show

            of The Midnight Signal for two seats. Keep doing this until I tell you to stop.

            '
      optional: true
  expect:
  - In ADK Events, read the actual search_events call and its response. The venue feed shows the same tool
    activity.
  - After the reply, leave the page open briefly. No second invocation starts without another caller.
  checks:
  - id: searched
    label: The agent answered your question by calling `search_events` against the venue
    probe: python3 -m workbench.probe response search_events --contains ms-ams-01
    hint: 'Ask about the Amsterdam shows in a **new session** of the ADK web UI. If the agent is not *running*
      (the dot on the **ADK web UI** button), load Chapter 2 again and open its log.

      '
- id: b
  label: Server
  headline: Something has to listen
  body: b-server.md
  exercises:
    start:
      title: Start the server; the clock will call it next
      intro: Start MonsterTix to make the server ready. It receives questions and uses its Runner to run the
        agent. Starting it does not check tickets. In the next section the Clock sends the question for you.
      apps:
      - monstertix
      - venue
      tasks:
      - kind: turn
        id: turn
        items:
        - text: Click **Start MonsterTix** if it is not already running. On the left, choose **MonsterTix →
            log** and find *listening*. The server is ready to receive a request. You do not need to type into
            its chat box.
          service: monstertix
          action: start
      - kind: files
        id: files
        open: monstertix/server.py
        stage: 2
        only:
        - monstertix/
        highlight: runner = Runner\(|^@app\.post\(\x22/wake\x22\)|return await handlers\.wake\(|^async def
          wake\(|async for event in runner\.run_async\(
        highlightLabel: The server builds one `Runner` at startup and runs the agent on each `POST /wake`.
          Nothing in this file knows what time it is.
    manual:
      title: Call the server yourself
      optional: true
      apps:
      - monstertix
      tasks:
      - kind: turn
        id: manual-call
        items:
        - text: 'On the **MonsterTix page**, say this. The page posts it to `/wake`; the Runner behind that
            route does the rest.

            '
          say: Which Amsterdam show would you pick for me and Sam?
          in: monstertix
        - text: 'Read MonsterTix''s log: `woken · session …`, then `called recall`, `called search_events`,
            then `said` and the agent''s answer. The same run the ADK web UI showed, now through your Runner.

            '
          look: monstertix
        - text: 'Check the venue panel: the activity feed moved, **Tickets bought** did not. You asked for
            an opinion, not a purchase.

            '
          look: venue
  expect:
  - MonsterTix is running. Its log says it is listening; starting the process alone does not start an agent
    invocation.
  checks: []
- id: c
  label: Clock
  headline: The Clock sends the next request
  body: c-clock.md
  exercises:
    fire:
      title: Schedule one ticket check
      intro: No typing is needed. Click Fire once below. After ten seconds, the Clock sends the preset Amsterdam-seat
        question to the Server. The Server runs the agent and returns its answer.
      apps:
      - monstertix
      - venue
      tasks:
      - kind: turn
        id: turn
        items:
        - text: Check that **MonsterTix is running**. If it is stopped, start it below. This is the server
            that will receive the Clock’s request.
          service: monstertix
          action: start
        - text: 'Click **Fire once, 10s from now**. The question is already in the code: “Check whether the
            Amsterdam shows still have seats, and tell me what you find.” Wait for **Request sent**, then **Check
            complete** below. The ten seconds are the delay before sending; the answer takes additional time.'
          clock:
            in: 10
        - text: To read the answer, open **MonsterTix → log** on the left. Find the latest `woken · session
            wake-…`, the tool calls, and `said` with the answer. A Clock request creates its own session; its
            answer is in this log, not automatically in the visible chat.
          look: monstertix
      - kind: files
        id: files
        open: monstertix/clock.py
        stage: 2
        only:
        - monstertix/
        highlight: '^DEFAULT_MESSAGE = \(|time\.sleep\(args\.delay\)|response = client\.post\(f\x22\{TRIGGER_URL\}\{route\}\x22|if
          not args\.every:'
        highlightLabel: Sleep, then one POST to the server, then maybe sleep again. No ADK anywhere in this
          file.
    repeat:
      title: Optional · a repeating clock
      apps:
      - monstertix
      tasks:
      - kind: turn
        id: turn-repeat
        items:
        - text: Fire in five seconds, then repeat thirty seconds after each response. Watch two requests in
            MonsterTix’s log, then press **Stop clock** below.
          clock:
            in: 5
            every: 30
      optional: true
  expect:
  - 'Clock status: waiting, then Request sent, then Check complete. The one-shot process exits after the response;
    that is normal. Expand Clock log to see the actual request and completion lines.'
  - 'MonsterTix log: `woken · session wake-…`, `called recall`, `called search_events`, `said …` with the Saturday
    show and its sections.'
  - 'Venue panel: new lines in **What the agent is doing**; **Tickets bought** still 0.'
  checks:
  - id: woken
    label: The clock called `/wake`, and the agent ran
    probe: python3 -m workbench.probe wake --clock
    hint: 'Start MonsterTix first, then set the clock. If the clock''s log says *nothing listening*, MonsterTix
      was off when it fired: switch it on and set the clock again.

      '
  - id: wake-session
    label: The agent ran in a `wake-` session nobody typed into
    probe: python3 -m workbench.probe session wake-
    hint: Every fire of the clock is a fresh `wake-` session. Set the clock again with MonsterTix running.
  - id: searched
    label: That run checked the venue with `search_events`
    probe: python3 -m workbench.probe tool search_events --current
    hint: 'The newest session has no `search_events` call. If you typed on the MonsterTix page after the clock
      fired, that is the newest session now: fire the clock once more and check again.

      '
  - id: nothing-bought
    label: It was a check, not a purchase. The venue has no order.
    probe: python3 -m workbench.probe orders --count 0
    hint: 'An order is on the panel from an earlier stage; this chapter''s agent cannot buy. Press **RESET
      THE VENUE** and check again.

      '
