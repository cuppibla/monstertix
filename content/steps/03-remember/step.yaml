title: Remember What Matters
minutes: 18
color: cyan
stage: 3
summary: Follow one conversation into the Session DB, save one preference through the Memory Service, then try it
  in one new session. The diagrams and code explain why the two stores behave differently.
parts:
- id: a
  label: Session DB
  headline: 'Session DB: where this task lives'
  body: a-session-db.md
  exercises:
    run:
      title: One conversation, then look where it went
      intro: Load chapter 3. It copies the code, rebuilds `sessions.db` with the two-day-old conversation back in
        it, and restarts the agent with both storage flags.
      apps:
      - agent
      tasks:
      - kind: prepare
        id: prepare
        step: 3
      - kind: files
        id: files
        open: agent/concert/tools.py
        stage: 3
        compare: 2
        only:
        - agent/concert/
        highlight: ^def note_companion|state\["user:prefs"\] =|state\["temp:seatmap"\] =|save_artifact\(|^def remember|^async
          def recall
        highlightLabel: 'Three new writers: `note_companion` puts a fact in `user:prefs`, `get_seatmap` keeps a
          summary in `temp:seatmap` and the full map in an artifact, and `recall`/`remember` read and write the
          memory file. Each lands in a different store.'
      - kind: turn
        id: turn
        items:
        - text: In the ADK web UI, press **New Session** in the top bar. It may say **NEW SESSION** and
            **State is empty** until you send the first message below. After that message, note the new session ID.
          look: agent
        - text: One message. It should call `recall`, `search_events` and `get_seatmap`, and answer with the **Saturday**
            show without asking which night, how many seats, or where you like to sit. Everything it needs is in
            memory.
          say: Get me and Sam two tickets to the Amsterdam show.
          in: agent
        - text: 'In this **new session**, open the recall response and the get_seatmap call in **Events**.
            Then open **State** and expand `user:prefs`: Sam says `cannot do weeknights`. `temp:seatmap` is
            absent because it was only for this invocation. If you opened `two-days-ago`, its extra
            `target_event_id` and `party_size` are expected; return to your new session for the next section.'
          look: agent
    sql:
      title: Read the Session DB with SQL
      optional: true
      tasks:
      - kind: turn
        id: session-sql
        items:
        - text: 'Read the same thing straight from the database. One read-only query: the tables, the sessions,
            how many events each holds, and the user-scoped state.'
          run: .venv/bin/python -c "import sqlite3, json; db = sqlite3.connect('file:sessions.db?mode=ro', uri=True);
            print('tables      ', [r[0] for r in db.execute('select name from sqlite_master where type=\"table\"')]);
            print('sessions    ', db.execute('select id, app_name, user_id from sessions').fetchall()); print('events      ',
            db.execute('select session_id, count(*) from events group by session_id').fetchall()); print('user_states
            ', db.execute('select app_name, user_id, state from user_states').fetchall()); print('session rows',
            db.execute('select id, state from sessions').fetchall())"
  expect:
  - '`⚡ recall`, then `⚡ search_events`, then `⚡ get_seatmap("ms-ams-01")`, and an answer naming **Saturday 14 November**
    at Ziggo Dome with section A at $210, section B $145, section C $95. It did not ask which night.'
  - '**Events**: one row per message, per tool call and per tool return. **State**: `user:prefs` is there; `temp:seatmap`
    is not.'
  checks:
  - id: seeded
    label: The two-day-old conversation is in `sessions.db`
    probe: curl -sf $AGENT_URL/apps/concert/users/user/sessions/two-days-ago
    contains: two-days-ago
    hint: This asks `adk web` for the session by id, so the agent has to be running. Loading chapter 3 rebuilds
      `sessions.db` with it; if it is missing, press **Load chapter 3** again and wait for the agent to come back.
  - id: recall
    label: Your session called `recall` before answering
    probe: python3 -m workbench.probe tool recall --current
    hint: In a **new** session, send "Get me and Sam two tickets to the Amsterdam show." If the agent asked which
      show instead of calling `recall`, send the message again in another new session.
  - id: saturday
    label: It read the seat map for the Saturday show, `ms-ams-01`
    probe: python3 -m workbench.probe tool get_seatmap --current
    contains: ms-ams-01
    hint: The Tuesday show is `ms-ams-02` and $10 cheaper; memory says Sam bails on weeknights. If it chose Tuesday,
      the `recall` return was ignored. Start a new session and ask again.
  - id: prefs
    label: '`user:prefs` is visible from your new session'
    probe: python3 -m workbench.probe state user:prefs --contains weeknight
    hint: '`user:` state is stored against the user, not the session, so it is there before you type anything. If
      it is missing, load chapter 3 again; the seed writes it.'
  - id: temp
    label: '`temp:seatmap` was never written to the database'
    probe: python3 -m workbench.probe state temp:seatmap --absent --after-tool get_seatmap
    hint: This row waits until `get_seatmap` has run in your session. Once it has, `temp:` keys are stripped before
      the state is saved, so the key is absent and the row passes.
- id: b
  label: Memory
  headline: 'Memory Service: bring the past into this task'
  body: b-memory.md
  exercises:
    run:
      title: Write one preference, then recall it in a new session
      needs: Chapter 3 loaded (the bar in 3a).
      intro: Keep the session from 3a. Save an aisle preference, inspect the saved memory beside the instruction, then create one new session to see whether it recalls that preference.
      apps:
      - agent
      tasks:
      - kind: files
        id: memory
        open: memory/userx.md
        only:
        - memory/
        - agent/concert/memory.py
      - kind: turn
        id: turn
        items:
        - text: In the session from 3a, open **✓ recall** in Events. Find Sam’s weekend rule, then the Saturday
            event_id in get_seatmap. No need to send the same request again.
          look: agent
        - text: In the same ADK chat, send this message. Open the `remember` response in **Events** to confirm
            the save. Then click **Show memory file** below to find the aisle preference in the actual file.
            If it is already open, click **Read latest memory**. No need to refresh ADK Web.
          say: Remember this for next time — we always want aisle seats.
          in: agent
          inspectFile: memory/userx.md
        - text: 'Now press **New Session** once. Send the original request and open its recall response: does it
            contain the aisle preference? The old conversation stays in session A.'
          say: Get me and Sam two tickets to the Amsterdam show.
          in: agent
  expect:
  - Session A calls remember, and memory/userx.md gains an aisle preference.
  - Session B has its own Events. Its recall response contains the preference written during session A.
  checks:
  - id: recalled-new
    label: The new session recalled the saved aisle preference
    probe: python3 -m workbench.probe response recall --current --contains aisle
    hint: Create one new session after saving the preference, ask for the Amsterdam tickets, and open its recall
      response.
  - id: file
    label: The memory file now mentions aisle seats
    probe: python3 -m workbench.probe memory --contains aisle
    hint: '`remember` writes under `## Preferences` in `memory/userx.md`. If `⚡ remember` ran and the file did not
      change, check the agent log for a write error, then restart the agent.'
- id: c
  label: Services
  headline: Services, lifetimes, and summaries
  body: c-services.md
  exercises:
    run:
      title: Inspect the seat-map artifact
      needs: The original session A from 3a, where get_seatmap ran.
      intro: No new code and no new conversation. You are reading what the last two sections left behind, in three
        different stores.
      apps:
      - agent
      tasks:
      - kind: files
        id: files
        open: agent/concert/agent.py
        stage: 3
        compare: 2
        only:
        - agent/concert/
        - artifacts/
        - memory/
        expand:
        - artifacts/
        highlight: ^app = App\(|events_compaction_config=EventsCompactionConfig\(|compaction_interval=|overlap_size=|summarizer=LlmEventSummarizer
        highlightLabel: '`App` wraps the agent so settings that belong to the whole application, like compaction,
          have somewhere to live. `compaction_interval=3` is tuned for a workshop.'
      - kind: turn
        id: turn
        items:
        - text: 'Open the **Artifacts** tab, in the session where you asked for the seat map in 3a or 3b: `seatmap_ms-ams-01.json`,
            version 0. Artifacts are filed by session, so `two-days-ago` and a brand-new session show an empty list.
            In the explorer, expand `artifacts/` and find the same file on disk; press ↻ if it is not listed yet.'
          look: agent
      optional: true
  expect: []
  checks: []
