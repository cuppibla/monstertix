<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<style>text{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;fill:#0F172A}.mono{font-family:"SF Mono",Menlo,Consolas,monospace}.sub{font-size:20px;fill:#64748B}.label{font-size:18px;fill:#64748B}.node{font-size:23px;font-weight:600}.white{fill:white}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94A3B8"/></marker><marker id="purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8B5CF6"/></marker><marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#10B981"/></marker></defs>
<rect width="1600" height="950" fill="white"/>
<text x="70" y="80" font-size="34" font-weight="700">Resume means “check again” — the venue decides</text>
<text x="70" y="120" class="sub">The button answers the saved pause. check_front then reads the current position of the same ticket.</text>
<g fill="#F8FAFC" fill-opacity=".6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"><rect x="70" y="170" width="330" height="540" rx="18"/><rect x="440" y="170" width="740" height="540" rx="18"/><rect x="1220" y="170" width="310" height="540" rx="18"/></g>
<g class="mono" font-size="18" style="fill:#334155"><text x="95" y="205">Workbench</text><text x="465" y="205">ADK · concert/nightly.py</text><text x="1245" y="205">Venue · venue/app.py</text></g>
<g text-anchor="middle">
<rect x="95" y="290" width="280" height="110" rx="14" fill="white" stroke="#94A3B8" stroke-width="2"/>
<text x="235" y="330" class="node">Resume current task</text><text x="235" y="367" class="label">Same session · same pause</text>
<rect x="480" y="290" width="300" height="110" rx="14" fill="white" stroke="#94A3B8" stroke-width="2"/>
<text x="630" y="330" class="mono node">check_front</text><text x="630" y="367" class="mono" font-size="17">rerun_on_resume=True</text>
<rect x="1245" y="290" width="260" height="110" rx="14" fill="white" stroke="#94A3B8" stroke-width="2"/>
<text x="1375" y="330" class="node">Current queue</text><text x="1375" y="367" class="label">Your saved ticket</text>
<path d="M375 345H480" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#purple)"/>
<text x="425" y="252" class="mono" font-size="18" style="fill:#8B5CF6">POST /run</text><text x="425" y="278" class="mono" font-size="16" style="fill:#8B5CF6">checked: true</text>
<path d="M780 345H1245" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
<text x="1010" y="312" class="mono label">GET /queue/{ticket}</text>
<path d="M1375 400V495H1130" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
<text x="1340" y="465" class="label">live status</text>
<path d="M1050 425L1130 495L1050 565L970 495Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
<text x="1050" y="503" class="mono" font-size="23" style="fill:#92400E">ready?</text>
<path d="M970 495H830V535H780" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="860" y="468" class="mono label">false</text>
<rect x="480" y="485" width="300" height="100" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
<text x="630" y="526" class="mono node" style="fill:#92400E">⏸ RequestInput</text><text x="630" y="560" class="label">Still waiting · pause again</text>
<path d="M1050 565V620" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#green)"/>
<text x="1115" y="596" class="mono label" style="fill:#047857">true</text>
<rect x="900" y="620" width="250" height="65" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<text x="1025" y="661" class="mono" font-size="22" style="fill:#047857">ready_to_buy</text>
<text x="650" y="638" class="sub">Completed earlier nodes reuse</text><text x="650" y="668" class="sub">their saved outputs.</text>
<path d="M480 535H420V750H235V400" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#purple)"/>
<text x="330" y="780" font-size="18" font-weight="600" style="fill:#8B5CF6">Wait for another Resume signal</text>
<g font-size="14" font-weight="700"><circle cx="425" cy="345" r="15" fill="#0F172A"/><text x="425" y="350" class="white">1</text><circle cx="1000" cy="345" r="15" fill="#0F172A"/><text x="1000" y="350" class="white">2</text><circle cx="1200" cy="495" r="15" fill="#0F172A"/><text x="1200" y="500" class="white">3</text></g>
</g>
<g transform="translate(750 765)" font-size="14"><rect width="26" height="18" rx="5" fill="white" stroke="#94A3B8"/><text x="34" y="14">Function / service</text><rect x="190" width="26" height="18" rx="5" fill="#FFFBEB" stroke="#F59E0B"/><text x="224" y="14">Pause / decision</text><rect x="380" width="26" height="18" rx="5" fill="#ECFDF5" stroke="#10B981"/><text x="414" y="14">Complete</text></g>
<rect x="70" y="850" width="1460" height="65" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
<text x="100" y="890" font-size="21" font-weight="600" style="fill:#92400E">checked: true is only a wake-up signal. ready: true must come from a fresh venue check.</text>
</svg>
