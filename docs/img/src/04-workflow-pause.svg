<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<style>text{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;fill:#0F172A}.mono{font-family:"SF Mono",Menlo,Consolas,monospace}.sub{font-size:20px;fill:#64748B}.label{font-size:18px;fill:#64748B}.node{font-size:22px;font-weight:600}.white{fill:white}</style>
<defs><linearGradient id="agent"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94A3B8"/></marker><marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#10B981"/></marker></defs>
<rect width="1600" height="800" fill="white"/>
<text x="70" y="80" font-size="34" font-weight="700">The workflow pauses at check_front</text>
<text x="70" y="120" class="sub">One task: choose two seats, join the queue, then wait until this ticket reaches the front.</text>
<rect x="70" y="170" width="1460" height="450" rx="18" fill="#F8FAFC" fill-opacity=".6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="95" y="205" class="mono" font-size="18" fill="#334155">ADK · agent/concert/nightly.py · concert_nightly</text>
<g text-anchor="middle">
<rect x="100" y="285" width="240" height="110" rx="14" fill="white" stroke="#94A3B8" stroke-width="2"/>
<text x="220" y="330" class="mono node">open_the_night</text><text x="220" y="365" class="label">Prepare the request</text>
<rect x="385" y="285" width="240" height="110" rx="14" fill="url(#agent)"/>
<text x="505" y="330" class="mono node white">✦ pick_show</text><text x="505" y="365" font-size="18" class="white">Choose show + seats</text>
<rect x="670" y="285" width="240" height="110" rx="14" fill="white" stroke="#94A3B8" stroke-width="2"/>
<text x="790" y="330" class="mono node">queue_up</text><text x="790" y="365" class="label">Get one queue ticket</text>
<rect x="955" y="285" width="240" height="110" rx="14" fill="white" stroke="#94A3B8" stroke-width="2"/>
<text x="1075" y="330" class="mono node">check_front</text><text x="1075" y="365" class="label">Ask the venue: ready?</text>
<rect x="1240" y="285" width="260" height="110" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<text x="1370" y="330" class="mono node" style="fill:#047857">ready_to_buy</text><text x="1370" y="365" class="label">Finish · no purchase yet</text>
<text x="220" y="255" class="mono label">START</text>
<text x="505" y="255" class="label">request</text><text x="790" y="255" class="label">plan</text><text x="1075" y="255" class="label">plan + ticket</text><text x="1370" y="255" class="label" style="fill:#047857">ready: true</text>
<path d="M340 340H385 M625 340H670 M910 340H955" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
<!-- Individual arrows keep a marker on each graph edge. -->
<path d="M340 340H385" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/><path d="M625 340H670" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>
<path d="M1195 340H1240" stroke="#10B981" stroke-width="2" marker-end="url(#green)"/>
<g font-size="14" font-weight="700"><circle cx="220" cy="222" r="15" fill="#0F172A"/><text x="220" y="227" class="white">1</text><circle cx="505" cy="222" r="15" fill="#0F172A"/><text x="505" y="227" class="white">2</text><circle cx="790" cy="222" r="15" fill="#0F172A"/><text x="790" y="227" class="white">3</text><circle cx="1075" cy="222" r="15" fill="#0F172A"/><text x="1075" y="227" class="white">4</text><circle cx="1370" cy="222" r="15" fill="#0F172A"/><text x="1370" y="227" class="white">5</text></g>
<path d="M1075 395V490" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="1180" y="450" class="mono label">ready: false</text>
<rect x="865" y="490" width="420" height="95" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
<text x="1075" y="530" class="mono node" style="fill:#92400E">⏸ RequestInput</text><text x="1075" y="565" class="mono label" style="fill:#92400E">interrupt_id="queue:wait"</text>
</g>
<text x="105" y="500" font-size="24" font-weight="600">Waiting does not keep the agent running.</text>
<text x="105" y="537" class="sub">ADK saves the pause, plan and ticket in the session DB.</text>
<text x="105" y="570" class="sub">The venue keeps the place in line.</text>
<g transform="translate(70 650)" font-size="14"><rect width="26" height="18" rx="5" fill="url(#agent)"/><text x="36" y="14">LLM agent</text><rect x="190" width="26" height="18" rx="5" fill="white" stroke="#94A3B8"/><text x="226" y="14">Python function</text><rect x="420" width="26" height="18" rx="5" fill="#FFFBEB" stroke="#F59E0B"/><text x="456" y="14">Saved pause</text><rect x="630" width="26" height="18" rx="5" fill="#ECFDF5" stroke="#10B981"/><text x="666" y="14">Task complete</text></g>
<rect x="70" y="700" width="1460" height="70" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
<text x="100" y="742" font-size="21" font-weight="600" style="fill:#92400E">Chapter 4 stops at “ready to buy”. Chapter 5 adds permission, guard checks and the purchase.</text>
</svg>
